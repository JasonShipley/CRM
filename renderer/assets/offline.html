<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>MCE Quotes — no connection</title>
<style>
  @font-face { font-family: "Oswald"; font-weight: 400 700;
    src: url("/assets/fonts/oswald.woff2") format("woff2"); }
  html, body { height: 100%; }
  body { margin: 0; background: #111; color: #fff; font-family: Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: max(20px, env(safe-area-inset-top)) 24px max(20px, env(safe-area-inset-bottom));
    box-sizing: border-box; }
  .box { max-width: 320px; }
  img { width: 220px; max-width: 80%; margin-bottom: 28px; background: #fff;
    padding: 10px 14px; border-radius: 2px; }
  h1 { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 18px;
    letter-spacing: .1em; text-transform: uppercase; color: #ff6602; margin: 0 0 10px; }
  p { color: #c8c7c7; font-size: 14px; line-height: 1.5; margin: 0 0 22px; }
  button { font: 600 14px/1 Helvetica, Arial, sans-serif; letter-spacing: .09em;
    text-transform: uppercase; background: #ff6602; color: #fff; border: 0;
    border-radius: 2px; padding: 14px 28px; }
</style>
</head>
<body>
<div class="box">
  <img src="/assets/mce-logo.png" alt="Midwest Custom Engineering">
  <h1>No connection</h1>
  <p>MCE Quotes needs the internet to size and price. Check your signal or Wi-Fi,
     then try again. Quotes you have saved are safe.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</div>
</body>
</html>
