# Overlay: HTTPS entrypoint for the stack.
# Use together with the base file and the renderer overlay:
#   docker compose -f docker-compose.yml -f docker-compose.renderer.yml -f docker-compose.caddy.yml up -d
services:
  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The quote builder's basic-auth hash, so it lives in .env rather than git
      # and does not have to be the Twenty CRM admin password. See Caddyfile.
      QUOTES_PASSWORD_HASH: ${QUOTES_PASSWORD_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

volumes:
  caddy-data:
  caddy-config:
